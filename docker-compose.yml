# Ambiente local do República.
#   Só o banco:        docker compose up -d postgres
#   Tudo (banco+API+web): docker compose --profile full up --build
services:
  postgres:
    image: postgres:17-alpine
    container_name: republica-postgres
    environment:
      POSTGRES_USER: republica
      POSTGRES_PASSWORD: republica
      POSTGRES_DB: republica
    ports:
      - '5432:5432'
    volumes:
      - republica-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U republica -d republica']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://republica:republica@postgres:5432/republica
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    ports:
      - '3333:3333'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  republica-pgdata:
